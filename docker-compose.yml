services:
  create-me:
    build: .
    image: create-me:latest
    container_name: create-me
    ports:
      - "3000:3000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HOST_IP=${HOST_IP:-}
      - SESSION_CODES=${SESSION_CODES:-townhall-2k26:1,tech-fest-2k26:2,ai-experience-2k26:3}
    restart: unless-stopped
