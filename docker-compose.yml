services:
  create-me:
    build: .
    image: create-me:latest
    container_name: create-me
    ports:
      - "3000:3000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HOST_IP=${HOST_IP:-}
      - SESSION_CODE=${SESSION_CODE:-create-me-townhall-2k26}
    restart: unless-stopped
