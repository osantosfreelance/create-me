substitutions:
  _SERVICE_NAME: create-me
  _REGION: europe-west1
  _SESSION_CODE: create-me-townhall-2k26
  _GEMINI_API_KEY: "" # Set via --substitutions flag during gcloud builds submit

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BUILD_ID

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=1
      - --max-instances=1
      - --concurrency=200
      - --set-env-vars=FORCE_HTTP=true,SESSION_CODE=${_SESSION_CODE},GEMINI_API_KEY=${_GEMINI_API_KEY}
      - --quiet

images:
  - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BUILD_ID
